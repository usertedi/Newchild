<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafeNet Guardian</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 350px;
            min-height: 400px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .header {
            text-align: center;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
        }

        .header h1 {
            font-size: 1.5rem;
            margin-bottom: 5px;
        }

        .header p {
            font-size: 0.9rem;
            opacity: 0.9;
        }

        .status-section {
            padding: 20px;
            text-align: center;
        }

        .status-indicator {
            display: inline-block;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            margin-right: 10px;
            vertical-align: middle;
        }

        .status-active {
            background: #4CAF50;
            box-shadow: 0 0 10px rgba(76, 175, 80, 0.5);
        }

        .status-inactive {
            background: #f44336;
            box-shadow: 0 0 10px rgba(244, 67, 54, 0.5);
        }

        .status-text {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            padding: 0 20px 20px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 15px;
            text-align: center;
        }

        .stat-number {
            font-size: 1.8rem;
            font-weight: 700;
            display: block;
        }

        .stat-label {
            font-size: 0.8rem;
            opacity: 0.9;
            margin-top: 5px;
        }

        .actions {
            padding: 0 20px 20px;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 10px;
            transition: all 0.3s ease;
            text-decoration: none;
            display: block;
            text-align: center;
        }

        .btn-primary {
            background: #4CAF50;
            color: white;
        }

        .btn-primary:hover {
            background: #45a049;
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-1px);
        }

        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 24px;
            margin-left: 10px;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 24px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: #4CAF50;
        }

        input:checked + .slider:before {
            transform: translateX(26px);
        }

        .recent-activity {
            padding: 0 20px 20px;
        }

        .activity-title {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .activity-item {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 8px;
            font-size: 0.8rem;
        }

        .activity-url {
            font-weight: 600;
            margin-bottom: 3px;
        }

        .activity-time {
            opacity: 0.8;
            font-size: 0.7rem;
        }

        .footer {
            padding: 15px 20px;
            text-align: center;
            font-size: 0.8rem;
            opacity: 0.8;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
        }

        .loading {
            text-align: center;
            padding: 40px 20px;
        }

        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top: 3px solid white;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🛡️ SafeNet Guardian</h1>
        <p>Family Protection Active</p>
    </div>

    <div class="status-section">
        <span class="status-indicator status-active" id="statusIndicator"></span>
        <span class="status-text" id="statusText">Protection Active</span>
        <label class="toggle-switch">
            <input type="checkbox" id="protectionToggle" checked>
            <span class="slider"></span>
        </label>
    </div>

    <div class="stats-grid">
        <div class="stat-card">
            <span class="stat-number" id="todayBlocks">0</span>
            <span class="stat-label">Blocks Today</span>
        </div>
        <div class="stat-card">
            <span class="stat-number" id="totalSites">0</span>
            <span class="stat-label">Blocked Sites</span>
        </div>
    </div>

    <div class="recent-activity">
        <div class="activity-title">Recent Activity</div>
        <div id="recentActivity">
            <div class="loading">
                <div class="spinner"></div>
                <p>Loading...</p>
            </div>
        </div>
    </div>

    <div class="actions">
        <a href="#" class="btn btn-primary" id="openDashboardBtn">
            <i class="fas fa-cog"></i> Open Dashboard
        </a>
        <a href="#" class="btn btn-secondary" id="viewLogsBtn">
            <i class="fas fa-list"></i> View All Logs
        </a>
    </div>

    <div class="footer">
        <p>Protecting your family 24/7</p>
    </div>

    <script src="popup.js"></script>
</body>
</html>
